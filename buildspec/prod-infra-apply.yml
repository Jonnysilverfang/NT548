version: 0.2

env:
  variables:
    TERRAFORM_VERSION: "1.16.3"

phases:
  install:
    commands:
      - "echo Checking Terraform binary"
      - "curl --fail --silent --show-error --location -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/$TERRAFORM_VERSION/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
      - "unzip -q -o /tmp/terraform.zip -d /usr/local/bin"
      - "rm -f /tmp/terraform.zip"
      - "terraform --version"
  build:
    commands:
      - "echo Applying Approved Terraform Plan"
      - "cd terraform/environments/prod"
      - "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)"
      - "terraform init -backend-config=\"bucket=nt548-terraform-state-${ACCOUNT_ID}\" -input=false"
      - "echo Applying tfplan generated in InfraPlan stage"
      - "terraform apply -auto-approve tfplan"
      - "echo PROD infrastructure successfully applied"
