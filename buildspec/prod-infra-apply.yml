version: 0.2

env:
  variables:
    TERRAFORM_VERSION: "1.16.3"

phases:
  install:
    commands:
      - "echo Phase 1 Preparing Terraform"
      - "curl --fail --silent --show-error --location -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/$TERRAFORM_VERSION/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
      - "unzip -q -o /tmp/terraform.zip -d /usr/local/bin"
      - "rm -f /tmp/terraform.zip"
      - "terraform --version"
      - "chmod +x scripts/*.sh"
  build:
    commands:
      - "echo Phase 2 Applying Infrastructure Changes"
      - >-
        if [ -f skip_infra.flag ]; then
          echo "[SKIP] Infrastructure apply skipped because no infrastructure changes were detected."
          exit 0
        fi
      - "bash scripts/terraform-pipeline.sh apply prod"
      - "echo PROD infrastructure successfully updated"
