version: 0.2

env:
  variables:
    AWS_REGION: "ap-southeast-1"
    ENVIRONMENT: "prod"

phases:
  install:
    runtime-versions:
      nodejs: 20
      python: 3.12
    commands:
      - "pip install -r be-product-service/requirements.txt"
  pre_build:
    commands:
      - "node -c be-user-service/server.js"
      - "node -c be-order-service/server.js"
      - "python -m py_compile be-product-service/app.py"
      - "export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)"
      - "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
      - "COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)"
      - "test -n \"$COMMIT_HASH\" || { echo 'Missing source commit SHA; refusing a non-immutable image tag'; exit 1; }"
      - "IMAGE_TAG=$COMMIT_HASH"
      - "echo Building PROD images with Tag $IMAGE_TAG"
  build:
    commands:
      - "echo Building PROD Docker images"
      - "docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/nt548-prod-user:$IMAGE_TAG ./be-user-service"
      - "docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/nt548-prod-product:$IMAGE_TAG ./be-product-service"
      - "docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/nt548-prod-order:$IMAGE_TAG ./be-order-service"
      - "docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/nt548-prod-frontend:$IMAGE_TAG ./frontend"
  post_build:
    commands:
      - "echo Pushing images to ECR PROD"
      - "docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/nt548-prod-user:$IMAGE_TAG"
      - "docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/nt548-prod-product:$IMAGE_TAG"
      - "docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/nt548-prod-order:$IMAGE_TAG"
      - "docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/nt548-prod-frontend:$IMAGE_TAG"
      - "echo Preparing PROD deployment metadata"
      - "printf '{\"commitHash\":\"%s\",\"imageTag\":\"%s\",\"environment\":\"prod\"}' \"$COMMIT_HASH\" \"$IMAGE_TAG\" > prod_build_metadata.json"
      - "echo PROD build completed successfully"

artifacts:
  files:
    - prod_build_metadata.json
    - scripts/**/*
    - buildspec/**/*
