version: 0.2

env:
  variables:
    TERRAFORM_VERSION: "1.16.3"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - "echo Phase 1 Installing Tooling"
      - "curl --fail --silent --show-error --location -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/$TERRAFORM_VERSION/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
      - "unzip -q -o /tmp/terraform.zip -d /usr/local/bin"
      - "rm -f /tmp/terraform.zip"
      - "terraform --version"
      - "pip3 install --upgrade pip"
      - "pip3 install checkov"
      - "checkov --version"
      - "chmod +x scripts/*.sh"
  pre_build:
    commands:
      - "echo Phase 2 Infrastructure Change Detection"
      - "bash scripts/detect-infra-changes.sh"
      - ". ./infra_changes.env"
  build:
    commands:
      - "echo Phase 3 Conditional Plan Execution"
      - "rm -f skip_infra.flag"
      - >-
        if [ "$INFRA_CHANGED" = "false" ]; then
          echo "[SKIP] Documentation-only change detected ($DOCS_ONLY). Skipping Terraform plan & apply."
          touch skip_infra.flag
          echo "No infrastructure changes required. (Documentation-only commit)" > tfplan.txt
        else
          echo "Step 3.1 Format Check"
          bash scripts/terraform-pipeline.sh fmt
          echo "Step 3.2 Validate PROD Configuration"
          bash scripts/terraform-pipeline.sh validate prod
          echo "Step 3.3 Security Scan with Checkov"
          bash scripts/terraform-pipeline.sh checkov
          echo "Step 3.4 Plan PROD Infrastructure"
          bash scripts/terraform-pipeline.sh plan prod
        fi

artifacts:
  files:
    - 'buildspec/prod-infra-apply.yml'
    - 'terraform/**/*'
    - 'scripts/**/*'
    - 'tfplan.txt'
    - 'skip_infra.flag'
    - 'infra_changes.json'
    - 'infra_changes.env'
