version: 0.2

env:
  variables:
    TERRAFORM_VERSION: "1.16.3"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - "echo Installing Terraform and Checkov"
      - "curl --fail --silent --show-error --location -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/$TERRAFORM_VERSION/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
      - "unzip -q -o /tmp/terraform.zip -d /usr/local/bin"
      - "rm -f /tmp/terraform.zip"
      - "terraform --version"
      - "pip3 install --upgrade pip"
      - "pip3 install checkov"
      - "checkov --version"
  pre_build:
    commands:
      - "echo Step 1 Terraform Format Check"
      - "terraform fmt -check -recursive"
  build:
    commands:
      - "echo Step 2 Terraform Init and Validate"
      - "cd terraform/environments/prod"
      - "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)"
      - "terraform init -backend-config=\"bucket=nt548-terraform-state-${ACCOUNT_ID}\" -backend-config=\"region=${AWS_REGION}\" -input=false"
      - "terraform validate"
      - "cd ../../.."
      - "echo Step 3 Checkov IaC Security Scan"
      - "checkov --config-file .checkov.yml"
      - "echo Step 4 Terraform Plan"
      - "cd terraform/environments/prod"
      - "terraform plan -out=tfplan -input=false"
      - "terraform show -no-color tfplan > tfplan.txt"
      - "echo Plan generated successfully"
      - "head -n 50 tfplan.txt"

artifacts:
  files:
    - 'buildspec/prod-infra-apply.yml'
    - 'terraform/**/*'
    - 'terraform/environments/prod/.terraform.lock.hcl'
