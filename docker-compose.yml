services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    environment:
      USER_SERVICE_HOST: be-user-service
      USER_SERVICE_PORT: "5001"
      PRODUCT_SERVICE_HOST: be-product-service
      PRODUCT_SERVICE_PORT: "5002"
      ORDER_SERVICE_HOST: be-order-service
      ORDER_SERVICE_PORT: "5003"
    depends_on:
      be-user-service:
        condition: service_healthy
      be-product-service:
        condition: service_healthy
      be-order-service:
        condition: service_healthy
    networks: [nt548]

  be-user-service:
    build: ./be-user-service
    ports:
      - "5001:5001"
    environment:
      PORT: "5001"
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-nt548-local-development-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nt548.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-nt548-demo}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-3600}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-nt548}
      DB_USER: ${DB_USER:-nt548_app}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_CA: ${DB_SSL_CA:-}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      DB_TIMEZONE: ${DB_TIMEZONE:-Z}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-10}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
    networks: [nt548]

  be-product-service:
    build: ./be-product-service
    ports:
      - "5002:5002"
    environment:
      PORT: "5002"
      JWT_SECRET: ${JWT_SECRET:-nt548-local-development-secret}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-nt548}
      DB_USER: ${DB_USER:-nt548_app}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_CA: ${DB_SSL_CA:-}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      DB_TIMEZONE: ${DB_TIMEZONE:-Z}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-10}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
    networks: [nt548]

  be-order-service:
    build: ./be-order-service
    ports:
      - "5003:5003"
    environment:
      PORT: "5003"
      JWT_SECRET: ${JWT_SECRET:-nt548-local-development-secret}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-nt548}
      DB_USER: ${DB_USER:-nt548_app}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_CA: ${DB_SSL_CA:-}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      DB_TIMEZONE: ${DB_TIMEZONE:-Z}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-10}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
    networks: [nt548]

networks:
  nt548:
    driver: bridge
